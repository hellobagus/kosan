# Kosanku — reverse proxy ke Next.js (PM2, port 3000)
#
# Instalasi di server (Ubuntu/Debian):
#   sudo cp nginx/kosanku.conf /etc/nginx/sites-available/kosanku
#   sudo ln -sf /etc/nginx/sites-available/kosanku /etc/nginx/sites-enabled/kosanku
#   sudo nginx -t && sudo systemctl reload nginx
#
# Pastikan aplikasi sudah berjalan: yarn pm2:start (dev) atau yarn pm2:deploy (production)

upstream kosanku_app {
    server 127.0.0.1:3000;
    keepalive 64;
}

server {
    listen 80;
    listen [::]:80;
    server_name 43.173.1.89;

    client_max_body_size 20M;

    access_log /var/log/nginx/kosanku-access.log;
    error_log /var/log/nginx/kosanku-error.log;

    # Foto & dokumen upload — disajikan langsung dari disk (tanpa auth middleware Next.js)
    location /uploads/ {
        alias /var/www/html/kosanku/public/uploads/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    location / {
        proxy_pass http://kosanku_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location /_next/static/ {
        proxy_pass http://kosanku_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
